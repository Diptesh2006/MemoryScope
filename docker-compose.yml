services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["./backend:/app", "./data:/app/data"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    environment: ["NEXT_PUBLIC_API_URL=http://localhost:8000/api"]
    ports: ["3000:3000"]
    depends_on: [backend]

